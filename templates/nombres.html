<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/css/estilonombres.css">
    <title>Ejercicio 2</title>
</head>
<body>
    <div class="card">
        <form method="POST">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1" required>

            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2" required>

            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3" required>

            <button type="submit">Enviar</button>
        </form>

        {% if nombre_mayor is not none %}
        <div class="resultado">
            <p>El nombre con mayor cantidad de caracteres es : {{ nombre_mayor }}</p>
            <p>El nombre tiene : {{ cantidad_letras }} caracteres</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
